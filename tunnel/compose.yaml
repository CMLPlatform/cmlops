# The tunnel connector. It dials out to Cloudflare and binds nothing; the hostnames, their
# services and Access live in infra/. The root compose.yaml includes this file; restart:
# unless-stopped brings it back after a crash or a reboot.
#
# The image is pinned by tag and digest. To upgrade, change both and run `docker compose up -d` again.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    # The host user, not the image's 65532: a file secret keeps the host file's owner and mode,
    # and the token file is 600.
    user: ${CMLOPS_UID:?set CMLOPS_UID in .env (id -u)}:${CMLOPS_GID:?set CMLOPS_GID in .env (id -g)}
    restart: unless-stopped
    # The services it fronts listen on the host's 127.0.0.1 only.
    network_mode: host
    command: tunnel --no-autoupdate run
    # A secret file, not TUNNEL_TOKEN: an environment variable shows in `docker inspect`.
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    read_only: true
    # NOTE: no NET_RAW turns off cloudflared's ICMP proxy, which only serves WARP pings.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

secrets:
  tunnel_token:
    # `just token` writes it; `just setup` refuses it unless it is mode 600.
    file: ${CMLOPS_STATE:?set CMLOPS_STATE in .env}/tunnel-token
