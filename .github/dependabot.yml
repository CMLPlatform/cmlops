version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Image tags and digests in the compose files.
  - package-ecosystem: "docker-compose"
    directories: ["/mlflow", "/serve", "/tunnel"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]

  # The Cloudflare provider and its lock file.
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      providers:
        patterns: ["*"]
